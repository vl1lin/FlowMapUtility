[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FlowMapUtility"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.11.1",
    "tqdm>=4.65",
]
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[tool.ruff.lint]
select = ["I", "E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
